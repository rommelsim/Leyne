<!-- Departly Play Store feature graphic — 1024×500.
     Identity source: assets/icon/src/light.svg ("route + live dot", 2026-07-25).
     Sky gradient #5CB8F2 → #2E8FE0, white route curve, node whose centre is the
     #1F74C0 live dot. Render with:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless --disable-gpu --hide-scrollbars --window-size=1024,500 \
         --screenshot=store_assets/feature_graphic_1024x500_route.png \
         file://$PWD/store_assets/feature_route.html
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  .stage {
    position: relative;
    width: 1024px; height: 500px;
    /* Same 0.17,0 → 0.83,1 diagonal as the icon's bg gradient. */
    background: linear-gradient(146deg, #5CB8F2 0%, #2E8FE0 100%);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  /* Top gloss — mirrors the icon's 18%-white wash over the upper half. */
  .gloss {
    position: absolute; inset: 0 0 auto 0; height: 250px;
    background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0));
  }
  .glow {
    position: absolute; right: -140px; top: -180px;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 68%);
  }
  svg { position: absolute; inset: 0; }

  /* Text sits in the left 55%; everything stays >64px from any edge so Play's
     crop on wide/short surfaces never eats it. */
  .copy { position: absolute; left: 80px; top: 50%; transform: translateY(-50%); }
  .word {
    font-size: 96px; font-weight: 700; letter-spacing: -3.2px;
    color: #fff; line-height: 1;
  }
  .tag {
    display: flex; align-items: center; gap: 11px;
    margin-top: 20px;
    font-size: 29px; font-weight: 500; letter-spacing: -.3px;
    color: rgba(255,255,255,.92);
  }
  .live {
    width: 11px; height: 11px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 5px rgba(255,255,255,.28);
  }
</style>

<div class="stage">
  <div class="gloss"></div>
  <div class="glow"></div>

  <svg viewBox="0 0 1024 500" fill="none">
    <!-- All route geometry is kept to x > 500 in the y 140–360 band, which is
         where the wordmark and tagline live. The first cut swept the hero
         curve across the full width and it ran clean through "Departly".

         Ghost routes: the same curve dropped and faded, so the mark reads as
         one line out of a network rather than a lone squiggle. -->
    <path d="M 510 600 C 750 600, 750 292, 908 292 L 1100 292"
          stroke="rgba(255,255,255,.15)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 600 660 C 840 660, 840 388, 998 388 L 1100 388"
          stroke="rgba(255,255,255,.09)" stroke-width="18" stroke-linecap="round"/>

    <!-- Hero route — the icon's path (M-10 112 C 40 112, 55 48, 96 48 L 175 48)
         re-proportioned to a 1024×500 field: node at 35% height, tail sweeping
         off the bottom edge rather than the left, to clear the copy. -->
    <path d="M 420 560 C 660 560, 660 175, 820 175 L 1100 175"
          stroke="#fff" stroke-width="26" stroke-linecap="round"/>

    <!-- Station node + live dot, matching the icon's r17/r8 ratio. -->
    <circle cx="820" cy="175" r="56" fill="rgba(255,255,255,.16)"/>
    <circle cx="820" cy="175" r="34" fill="#fff"/>
    <circle cx="820" cy="175" r="16" fill="#1F74C0"/>
  </svg>

  <div class="copy">
    <div class="word">Departly</div>
    <div class="tag"><span class="live"></span>Live SG bus &amp; MRT arrivals</div>
  </div>
</div>
